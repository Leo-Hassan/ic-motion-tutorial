site_name: 大桥 IDE / IC Motion 中文教程
site_description: 面向外部读者的版本化离线编程与仿真教程
site_url: https://Leo-Hassan.github.io/ic-motion-tutorial/
repo_url: https://github.com/Leo-Hassan/ic-motion-tutorial
repo_name: 教程源码与示例工程
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: material
  language: zh
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: zh
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
extra_css:
  - assets/stylesheets/extra.css
nav:
  - 教程入口: index.md
  - V0.0.17 手册（本地候选）:
      - 手册首页: v0.0.17/index.md
      - 版本与证据: v0.0.17/versions.md
      - 截图来源: assets/images/v0.0.17/PROVENANCE.md
      - 软件操作: v0.0.17/operations.md
      - 01 虚轴首次运动: v0.0.17/cases/01-first-virtual-axis.md
      - 02 ST 功能块与命令交接: v0.0.17/cases/02-st-command-handoff.md
      - 03 ST 断点与单步调试: v0.0.17/cases/03-st-breakpoint-step.md
      - 04 LD 编辑与仿真: v0.0.17/cases/04-ld-edit-simulate.md
      - 05 轴配置和限位: v0.0.17/cases/05-axis-limits.md
      - 06 设备映射与 CiA 402: v0.0.17/cases/06-device-mapping-cia402.md
      - 07 IS620N 双实轴离线构建: v0.0.17/cases/07-is620n-offline-build.md
      - 08 电子齿轮与相位调整: v0.0.17/cases/08-electronic-gear.md
      - 09 电子凸轮与表切换: v0.0.17/cases/09-electronic-cam.md
  - V0.0.14 手册:
      - 手册首页: v0.0.14/index.md
      - 版本与证据: v0.0.14/versions.md
